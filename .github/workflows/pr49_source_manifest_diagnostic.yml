name: PR49 Guarded Source Manifest Refresh

on:
  push:
    paths:
      - '.github/workflows/pr49_source_manifest_diagnostic.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Refresh reviewed source identities
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='1e1d037d95b642fb2827e8ba1244290d3b331097'
          ACTUAL_PARENT="$(git rev-parse HEAD^)"
          test "$ACTUAL_PARENT" = "$EXPECTED_PARENT"

          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          EXPECTED_BASELINE = '5d47c59a6e13d144988110b3776b1506561832a0'
          MANIFEST = Path('ci/source-entry/projection_manifest.json')
          ALLOWED_NEW_NATIVE = {'audio_engine/audio_server.old.soxR.exe'}
          ASSET_SUFFIXES = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.svg', '.bmp', '.avif',
              '.wav', '.mp3', '.ogg', '.flac', '.aac', '.m4a', '.ttf', '.otf', '.woff', '.woff2'
          }
          NATIVE_SUFFIXES = {'.exe', '.dll', '.so', '.dylib', '.node'}

          sys.path.insert(0, str(Path('ci/source-entry').resolve()))
          from github_source_entry import scanned_paths
          from source_projection_policy import protected_name

          manifest = json.loads(MANIFEST.read_text(encoding='utf-8'))
          if manifest.get('schema') != 'vcpchat-ci-source-profiles/v1' or manifest.get('repository') != 'JENN2046/VCPChat':
              raise SystemExit('unexpected manifest authority')

          raw = subprocess.check_output(['git', 'ls-tree', '-r', '-t', '-l', '-z', 'HEAD'])
          actual = {}
          folded = set()
          for record in raw.split(b'\0'):
              if not record:
                  continue
              meta, path_b = record.split(b'\t', 1)
              fields = meta.decode('ascii').split()
              mode, kind, sha = fields[:3]
              size = None if len(fields) < 4 or fields[3] == '-' else int(fields[3])
              path = path_b.decode('utf-8')
              if path.casefold() in folded:
                  raise SystemExit(f'duplicate casefold path: {path}')
              folded.add(path.casefold())
              row = {'path': path, 'mode': mode, 'type': kind, 'sha': sha}
              if size is not None:
                  row['size'] = size
              actual[path] = row

          blob_cache = {}
          def blob_bytes(sha):
              if sha not in blob_cache:
                  blob_cache[sha] = subprocess.check_output(['git', 'cat-file', 'blob', sha])
              return blob_cache[sha]

          def native_format(data):
              if data.startswith(b'\x7fELF'):
                  return 'ELF'
              if data.startswith(b'MZ'):
                  return 'PE'
              if data[:4] in {b'\xfe\xed\xfa\xce', b'\xce\xfa\xed\xfe', b'\xfe\xed\xfa\xcf', b'\xcf\xfa\xed\xfe'}:
                  return 'Mach-O'
              if data[:4] in {b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca', b'\xca\xfe\xba\xbf', b'\xbf\xba\xfe\xca', b'\0asm'}:
                  return 'other-executable-format'
              return None

          def identity(path, kind):
              row = actual.get(path)
              if not row or row.get('type') != 'blob' or row.get('mode') not in {'100644', '100755'} or not isinstance(row.get('size'), int):
                  raise SystemExit(f'unsupported selected entry: {path}')
              data = blob_bytes(row['sha'])
              if len(data) != row['size']:
                  raise SystemExit(f'blob size mismatch: {path}')
              return {
                  'path': path,
                  'mode': row['mode'],
                  'type': 'blob',
                  'blob': row['sha'],
                  'size': row['size'],
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'kind': kind,
              }

          def classify_new(path):
              row = actual[path]
              if row.get('type') != 'blob' or row.get('mode') not in {'100644', '100755'}:
                  raise SystemExit(f'new selected path has unsupported type/mode: {path}')
              if protected_name(path) or path in manifest.get('denied_paths', []):
                  raise SystemExit(f'protected/denied path selected: {path}')
              fmt = native_format(blob_bytes(row['sha']))
              suffix = Path(path).suffix.lower()
              if fmt:
                  if fmt not in {'ELF', 'PE', 'Mach-O'}:
                      raise SystemExit(f'unadmittable executable format: {path}')
                  if path not in ALLOWED_NEW_NATIVE:
                      raise SystemExit(f'unreviewed new native input: {path}')
                  return 'static-native'
              if suffix in NATIVE_SUFFIXES:
                  raise SystemExit(f'native-looking path without admitted native format: {path}')
              if suffix in ASSET_SUFFIXES:
                  return 'static-asset'
              return 'source'

          report = {}
          new_native_seen = set()
          for profile_name, profile in manifest['profiles'].items():
              old_entries = profile.get('entries', [])
              old_by_path = {entry['path']: entry for entry in old_entries}
              required = scanned_paths(actual, profile.get('required_scans', []))
              new_required = sorted(required - set(old_by_path))
              missing = sorted(path for path in old_by_path if path not in actual)
              changed = []
              refreshed = []

              for path, old in old_by_path.items():
                  if path not in actual:
                      continue
                  kind = old.get('kind')
                  if kind not in {'source', 'static-asset', 'static-native'}:
                      raise SystemExit(f'unknown existing kind: {profile_name}:{path}')
                  new = identity(path, kind)
                  if any(old.get(k) != new.get(k) for k in ('mode', 'blob', 'size', 'sha256')):
                      changed.append(path)
                  refreshed.append(new)

              for path in new_required:
                  kind = classify_new(path)
                  if kind == 'static-native':
                      new_native_seen.add(path)
                  refreshed.append(identity(path, kind))

              refreshed.sort(key=lambda entry: entry['path'])
              if not required.issubset({entry['path'] for entry in refreshed}):
                  raise SystemExit(f'incomplete required scan admission: {profile_name}')
              for entry in refreshed:
                  if protected_name(entry['path']) or entry['path'] in manifest.get('denied_paths', []):
                      raise SystemExit(f'protected admitted entry: {profile_name}:{entry["path"]}')

              profile['entries'] = refreshed
              native_rows = []
              for entry in refreshed:
                  data = blob_bytes(entry['blob'])
                  fmt = native_format(data)
                  if entry['kind'] == 'static-native':
                      if fmt not in {'ELF', 'PE', 'Mach-O'}:
                          raise SystemExit(f'native format mismatch: {entry["path"]}')
                      native_rows.append({**entry, 'format': fmt})
                  elif fmt or Path(entry['path']).suffix.lower() in NATIVE_SUFFIXES:
                      raise SystemExit(f'executable bytes lack separate native admission: {entry["path"]}')
              if 'static_native_assets' in profile or native_rows:
                  profile['static_native_assets'] = native_rows

              report[profile_name] = {
                  'old_count': len(old_entries),
                  'new_count': len(refreshed),
                  'changed_existing': changed,
                  'new_required': new_required,
                  'missing_existing': missing,
                  'native_count': len(native_rows),
              }

          if new_native_seen - ALLOWED_NEW_NATIVE:
              raise SystemExit(f'unreviewed new native set: {sorted(new_native_seen)}')

          old_aliases = manifest.get('ordinary_aliases', {})
          needed_aliases = set()
          for profile in manifest['profiles'].values():
              selected = {entry['path']: entry for entry in profile['entries']}
              selected_oids = {entry['blob'] for entry in profile['entries']}
              for path, row in actual.items():
                  if row.get('type') != 'blob' or path in selected or row.get('sha') not in selected_oids:
                      continue
                  if protected_name(path) or path in manifest.get('denied_paths', []):
                      raise SystemExit(f'selected bytes alias protected/denied path: {path}')
                  needed_aliases.add(path)
          unreviewed_aliases = sorted(needed_aliases - set(old_aliases))
          if unreviewed_aliases:
              raise SystemExit('new ordinary alias exception requires review: ' + ', '.join(unreviewed_aliases))
          refreshed_aliases = {}
          for path in sorted(needed_aliases):
              if path not in actual:
                  raise SystemExit(f'ordinary alias disappeared: {path}')
              refreshed_aliases[path] = identity(path, old_aliases[path].get('kind', 'source'))
          manifest['ordinary_aliases'] = refreshed_aliases
          manifest['reviewed_baseline'] = EXPECTED_BASELINE

          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          manifest_data = MANIFEST.read_bytes()
          manifest_pin = {
              'size': len(manifest_data),
              'blob': hashlib.sha1(b'blob ' + str(len(manifest_data)).encode('ascii') + b'\0' + manifest_data).hexdigest(),
              'sha256': hashlib.sha256(manifest_data).hexdigest(),
          }

          pin_pattern = re.compile(
              r"'ci/source-entry/projection_manifest\.json': \{'size': \d+, 'blob': '[0-9a-f]{40}', 'sha256': '[0-9a-f]{64}'\}"
          )
          pin_text = (
              "'ci/source-entry/projection_manifest.json': "
              f"{{'size': {manifest_pin['size']}, 'blob': '{manifest_pin['blob']}', 'sha256': '{manifest_pin['sha256']}'}}"
          )
          expected_replacements = {
              Path('.github/workflows/chat_kernel_ui.yml'): 1,
              Path('.github/workflows/mobile_sync.yml'): 3,
          }
          for path, expected in expected_replacements.items():
              text = path.read_text(encoding='utf-8')
              text, count = pin_pattern.subn(pin_text, text)
              if count != expected:
                  raise SystemExit(f'unexpected manifest pin replacement count for {path}: {count}')
              path.write_text(text, encoding='utf-8')

          print(json.dumps({'reviewed_baseline': EXPECTED_BASELINE, 'manifest_pin': manifest_pin, 'profiles': report,
                            'ordinary_aliases': sorted(refreshed_aliases), 'new_native_seen': sorted(new_native_seen)},
                           ensure_ascii=False, indent=2))
          PY

          python3 -m unittest discover -s ci/source-entry/tests -p 'test_*.py'
          python3 -m json.tool ci/source-entry/projection_manifest.json >/dev/null
          git diff --check

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          manifest = json.loads(Path('ci/source-entry/projection_manifest.json').read_text(encoding='utf-8'))
          counts = [len(manifest['profiles'][name]['entries']) for name in ['mobile-contracts','cds','package-smoke','chat-kernel-ui']]
          uniques = [len({row['blob'] for row in manifest['profiles'][name]['entries']}) for name in ['mobile-contracts','cds','package-smoke','chat-kernel-ui']]
          total = sum(uniques) + 20
          readme = Path('ci/source-entry/README.md')
          text = readme.read_text(encoding='utf-8')
          pattern = re.compile(
              r'The four current profiles contain [0-9,]+, [0-9,]+, [0-9,]+ and [0-9,]+ paths respectively\. Their\n'
              r'deduplicated body counts are [0-9,]+, [0-9,]+, [0-9,]+ and [0-9,]+\. Running all four jobs makes 20\n'
              r'Git Data REST metadata requests and [0-9,]+ public raw body requests including'
          )
          replacement = (
              f"The four current profiles contain {counts[0]:,}, {counts[1]:,}, {counts[2]:,} and {counts[3]:,} paths respectively. Their\n"
              f"deduplicated body counts are {uniques[0]:,}, {uniques[1]:,}, {uniques[2]:,} and {uniques[3]:,}. Running all four jobs makes 20\n"
              f"Git Data REST metadata requests and {total:,} public raw body requests including"
          )
          text, n = pattern.subn(replacement, text)
          if n != 1:
              raise SystemExit(f'README count paragraph replacement count: {n}')
          readme.write_text(text, encoding='utf-8')
          PY

          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/chat_kernel_ui.yml' '.github/workflows/mobile_sync.yml' 'ci/source-entry/README.md' 'ci/source-entry/projection_manifest.json' | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Commit guarded refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/chat_kernel_ui.yml .github/workflows/mobile_sync.yml
          git add ci/source-entry/README.md ci/source-entry/projection_manifest.json
          git commit -m 'Refresh reviewed CI source manifest for synced tree'
          git push origin HEAD:codex/update-vcpchat-20260912
