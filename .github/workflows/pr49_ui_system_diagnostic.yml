name: PR49 UI System Diagnostic

on:
  push:
    paths:
      - '.github/workflows/pr49_ui_system_diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Verify diagnostic parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '01acb262ac1709486c7bffde2f5de4432a4bdc91'

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-11

      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --omit=optional

      - name: Verify Electron runtime
        run: node -e "const electron = require('electron'); if (typeof electron !== 'string') throw new Error('Electron runtime path missing'); console.log(electron)"

      - name: Run UI system gate with bounded failure output
        shell: bash
        run: |
          set +e
          npm run check:ui-system > "$RUNNER_TEMP/ui-system.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '=== UI SYSTEM FAILURE TAIL (250 lines) ==='
            tail -n 250 "$RUNNER_TEMP/ui-system.log"
            echo '=== END UI SYSTEM FAILURE TAIL ==='
            exit "$status"
          fi
          echo 'UI_SYSTEM_GATE_PASS'
