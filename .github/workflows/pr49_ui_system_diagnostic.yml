name: PR49 UI Source Context Reconciliation

on:
  push:
    paths:
      - '.github/workflows/pr49_ui_system_diagnostic.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Reconcile source-context baseline and exact source identities
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='bd420cb5034dfd2c07a56926c7495d9d7c3eb696'
          BRANCH='codex/update-vcpchat-20260912'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "$BRANCH"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          script_path = Path('scripts/check-design-system-boundary.mjs')
          text = script_path.read_text(encoding='utf-8')
          old = """const sourceRef = process.env.VCP_DESIGN_SOURCE_REF || (() => {\n    try {\n        return execFileSync('git', ['merge-base', 'HEAD', 'origin/main'], { cwd: root, encoding: 'utf8' }).trim();\n    } catch {\n        return 'HEAD';\n    }\n})();"""
          new = """const sourceRef = process.env.VCP_DESIGN_SOURCE_REF\n    || sourceContext?.sourceCommit\n    || (() => {\n        try {\n            return execFileSync('git', ['merge-base', 'HEAD', 'origin/main'], { cwd: root, encoding: 'utf8' }).trim();\n        } catch {\n            return 'HEAD';\n        }\n    })();"""
          if text.count(old) != 1:
              raise SystemExit('expected sourceRef block not found exactly once')
          text = text.replace(old, new)
          script_path.write_text(text, encoding='utf-8')

          def identity(path):
              data = Path(path).read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              return {
                  'blob': blob,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          script_id = identity(script_path)
          manifest_path = Path('ci/source-entry/projection_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          hits = 0
          for profile_name, profile in manifest['profiles'].items():
              for entry in profile.get('entries', []):
                  if entry.get('path') == str(script_path):
                      if entry.get('mode') != '100644' or entry.get('type') != 'blob' or entry.get('kind') != 'source':
                          raise SystemExit(f'unexpected manifest contract for {profile_name}')
                      entry['blob'] = script_id['blob']
                      entry['size'] = script_id['size']
                      entry['sha256'] = script_id['sha256']
                      hits += 1
          if hits < 1:
              raise SystemExit('script is not admitted by any source profile')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_id = identity(manifest_path)
          workflow_paths = [
              Path('.github/workflows/chat_kernel_ui.yml'),
              Path('.github/workflows/mobile_sync.yml'),
          ]
          pin_pattern = re.compile(
              r"('ci/source-entry/projection_manifest\.json': \{'size': )\d+(, 'blob': ')[0-9a-f]{40}(', 'sha256': ')[0-9a-f]{64}('\})"
          )
          for workflow_path in workflow_paths:
              workflow = workflow_path.read_text(encoding='utf-8')
              replacement = (
                  rf"\g<1>{manifest_id['size']}\g<2>{manifest_id['blob']}"
                  rf"\g<3>{manifest_id['sha256']}\g<4>"
              )
              workflow, count = pin_pattern.subn(replacement, workflow)
              if count < 1:
                  raise SystemExit(f'projection manifest pin not found in {workflow_path}')
              workflow_path.write_text(workflow, encoding='utf-8')

          # The trust boundary stays intact: only the source-context seam,
          # the exact manifest identity, and its two bootstrap pins may change.
          print(json.dumps({'script': script_id, 'manifest': manifest_id, 'manifest_entry_hits': hits}, indent=2))
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            '.github/workflows/chat_kernel_ui.yml'
            '.github/workflows/mobile_sync.yml'
            'ci/source-entry/projection_manifest.json'
            'scripts/check-design-system-boundary.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

          grep -F "|| sourceContext?.sourceCommit" scripts/check-design-system-boundary.mjs
          node --check scripts/check-design-system-boundary.mjs
          python3 -m json.tool ci/source-entry/projection_manifest.json >/dev/null

          git config user.name 'Nuobao CI Reconciler'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'fix(ci): honor verified source baseline without git metadata'
          git push origin HEAD:"$BRANCH"
