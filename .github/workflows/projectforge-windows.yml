name: ProjectForge Windows source verification

on:
  pull_request:
    paths:
      - 'rust_projectforge_indexer/**'
      - 'VCPDistributedServer/Plugin/ProjectForge/bin/win32-x64/**'
      - '.github/workflows/projectforge-windows.yml'
      - '.github/scripts/build-projectforge-windows.ps1'
      - '.github/scripts/verify-projectforge-trace.cjs'
      - 'tests/projectforge-trace.test.cjs'
      - 'docs/native-build-3cde8466.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        env:
          # Hash the reviewed Git bytes, not a Windows CRLF working-copy conversion.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - name: Verify reviewed source and bundled artifact identities
        shell: pwsh
        run: |
          node --test tests/projectforge-trace.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Traceability negative tests failed.' }
          node .github/scripts/verify-projectforge-trace.cjs .
          if ($LASTEXITCODE -ne 0) { throw 'Source or bundled artifact provenance is stale.' }
      - name: Test and rebuild locked source with canonical paths
        shell: pwsh
        run: |
          $cargoRoot = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          ./.github/scripts/build-projectforge-windows.ps1 `
            -SourceDirectory (Join-Path $env:GITHUB_WORKSPACE 'rust_projectforge_indexer') `
            -CargoHome $cargoRoot `
            -TargetDirectory (Join-Path $env:GITHUB_WORKSPACE 'rust_projectforge_indexer/target')
      - name: Exercise bundled and rebuilt programs and record provenance
        shell: pwsh
        run: |
          $rebuilt = 'rust_projectforge_indexer/target/release/projectforge_indexer.exe'
          node .github/scripts/verify-projectforge-trace.cjs . $rebuilt projectforge-build-provenance.json
          if ($LASTEXITCODE -ne 0) {
            throw 'ProjectForge traceability or functional smoke failed.'
          }
      - name: Preserve rebuilt artifact and provenance for review
        uses: actions/upload-artifact@v4
        with:
          name: projectforge-windows-rebuilt
          path: |
            rust_projectforge_indexer/target/release/projectforge_indexer.exe
            projectforge-build-provenance.json
          if-no-files-found: error
          retention-days: 7
