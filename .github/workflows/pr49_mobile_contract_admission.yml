name: PR49 Source Manifest Pin Diagnostic

on:
  push:
    paths:
      - '.github/workflows/pr49_mobile_contract_admission.yml'

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 1
      - name: Report exact manifest pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/source-entry/projection_manifest.json)" = 'c95b76d9cd84ca380eaa80c665d2661ebf4f7e70'
          printf 'MANIFEST_SIZE=%s\n' "$(wc -c < ci/source-entry/projection_manifest.json)"
          printf 'MANIFEST_BLOB=%s\n' "$(git hash-object ci/source-entry/projection_manifest.json)"
          printf 'MANIFEST_SHA256=%s\n' "$(sha256sum ci/source-entry/projection_manifest.json | awk '{print $1}')"
