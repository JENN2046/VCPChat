name: PR49 Guarded Chat Test Identity Refresh

on:
  push:
    paths:
      - '.github/workflows/pr49_chat_test_identity_refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Refresh only reviewed Chat test identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e284fee1f28321e2d41c816d94de9b7465b64e7c'
          test "$(git hash-object ci/source-entry/projection_manifest.json)" = '8ccd9afd75c0d26d38725143f65455f43a053ba9'

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path('ci/source-entry/projection_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          targets = {
              'tests/content-pipeline.test.mjs',
              'tests/main-chat-surface-adapter.test.mjs',
          }
          seen = set()
          changed_rows = []

          def current_identity(path, kind):
              raw = subprocess.check_output(['git', 'ls-tree', '-l', 'HEAD', '--', path], text=True).strip()
              if not raw:
                  raise SystemExit(f'missing reviewed test: {path}')
              meta, actual_path = raw.split('\t', 1)
              mode, obj_type, blob, size_text = meta.split()
              if actual_path != path or obj_type != 'blob' or mode != '100644':
                  raise SystemExit(f'unexpected reviewed test identity: {path}')
              size = int(size_text)
              data = subprocess.check_output(['git', 'cat-file', 'blob', blob])
              if len(data) != size:
                  raise SystemExit(f'blob size mismatch: {path}')
              return {
                  'path': path,
                  'mode': mode,
                  'type': 'blob',
                  'blob': blob,
                  'size': size,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'kind': kind,
              }

          for profile_name, profile in manifest['profiles'].items():
              entries = profile.get('entries', [])
              for index, entry in enumerate(entries):
                  path = entry.get('path')
                  if path not in targets:
                      continue
                  if entry.get('kind') != 'source':
                      raise SystemExit(f'reviewed test is not source: {profile_name}:{path}')
                  replacement = current_identity(path, 'source')
                  if replacement['blob'] == entry.get('blob'):
                      raise SystemExit(f'reviewed test identity did not change: {path}')
                  entries[index] = replacement
                  seen.add(path)
                  changed_rows.append({
                      'profile': profile_name,
                      'path': path,
                      'blob': replacement['blob'],
                      'size': replacement['size'],
                      'sha256': replacement['sha256'],
                  })

          if seen != targets:
              raise SystemExit(f'exact reviewed test set mismatch: seen={sorted(seen)}')
          if len(changed_rows) != 2:
              raise SystemExit(f'unexpected reviewed test occurrence count: {len(changed_rows)}')

          manifest['reviewed_baseline'] = 'f1b91696a1f1f29b0ad01f6507bb1cde4012a2d3'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          final = manifest_path.read_bytes()
          pin = {
              'size': len(final),
              'blob': hashlib.sha1(b'blob ' + str(len(final)).encode('ascii') + b'\0' + final).hexdigest(),
              'sha256': hashlib.sha256(final).hexdigest(),
          }
          print('CHANGED_ROWS=' + json.dumps(changed_rows, ensure_ascii=False, sort_keys=True))
          print('MANIFEST_SIZE=' + str(pin['size']))
          print('MANIFEST_BLOB=' + pin['blob'])
          print('MANIFEST_SHA256=' + pin['sha256'])

          old = "'ci/source-entry/projection_manifest.json': {'size': 645253, 'blob': '8ccd9afd75c0d26d38725143f65455f43a053ba9', 'sha256': '247862c8d37c0686215d8a3eeaabd7277bf35dc95ef7e276cbf4c47e6dcef2be'}"
          new = ("'ci/source-entry/projection_manifest.json': "
                 f"{{'size': {pin['size']}, 'blob': '{pin['blob']}', 'sha256': '{pin['sha256']}'}}")
          jobs = [
              (Path('.github/workflows/chat_kernel_ui.yml'), Path('ci/source-entry/pr49-chat-kernel-ui.next.yml'), 1),
              (Path('.github/workflows/mobile_sync.yml'), Path('ci/source-entry/pr49-mobile-sync.next.yml'), 3),
          ]
          for source, target, expected in jobs:
              text = source.read_text(encoding='utf-8')
              if text.count(old) != expected or new in text:
                  raise SystemExit(f'unexpected current manifest pin state: {source}')
              next_text = text.replace(old, new)
              if next_text.count(new) != expected or next_text.replace(new, old) != text:
                  raise SystemExit(f'non-pin drift while generating {target}')
              target.write_text(next_text, encoding='utf-8')
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s ci/source-entry/tests -p 'test_*.py'
          python3 -m json.tool ci/source-entry/projection_manifest.json >/dev/null
          git diff --check
          CHANGED="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort )"
          EXPECTED="$(printf '%s\n' ci/source-entry/projection_manifest.json ci/source-entry/pr49-chat-kernel-ui.next.yml ci/source-entry/pr49-mobile-sync.next.yml | sort)"
          printf 'ACTUAL_SCOPE<<EOF\n%s\nEOF\n' "$CHANGED"
          printf 'EXPECTED_SCOPE<<EOF\n%s\nEOF\n' "$EXPECTED"
          test "$CHANGED" = "$EXPECTED"

      - name: Commit manifest and exact next workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/source-entry/projection_manifest.json ci/source-entry/pr49-chat-kernel-ui.next.yml ci/source-entry/pr49-mobile-sync.next.yml
          git commit -m 'Refresh Chat test source identities'
          git push origin HEAD:codex/update-vcpchat-20260912
