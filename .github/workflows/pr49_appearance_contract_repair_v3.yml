name: PR49 Appearance Contract Repair V3

on:
  push:
    paths:
      - '.github/workflows/pr49_appearance_contract_repair_v3.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install locked dependencies without lifecycle scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts --omit=optional

      - name: Reconcile appearance contract and validate remaining UI tail
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='ef9cb88f88a71d7567b9cef667b922d86926dc7e'
          BRANCH='codex/update-vcpchat-20260912'
          TEST='scripts/test-appearance-engine.mjs'
          MANIFEST='ci/source-entry/projection_manifest.json'
          CHAT='.github/workflows/chat_kernel_ui.yml'
          MOBILE='.github/workflows/mobile_sync.yml'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "$BRANCH"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          test_path = Path('scripts/test-appearance-engine.mjs')
          text = test_path.read_text(encoding='utf-8')
          old = """assert.match(nextCss, /data-vcp-wallpaper-scope=\"global\"\\] \\.sidebar\\s*\\{[^}]*backdrop-filter:\\s*var\\(--next-backdrop-filter\\)/s,\n    'global wallpaper applies glass locally to the sidebar');"""
          new = """assert.match(nextCss, /data-vcp-wallpaper-scope=\"global\"\\] \\.sidebar\\s*\\{[^}]*background:\\s*transparent\\s*!important;[^}]*backdrop-filter:\\s*none\\s*!important/s,\n    'global wallpaper keeps the sidebar transparent so the shared material plane is not double-painted');\nassert.match(nextCss, /data-vcp-wallpaper-scope=\"global\"\\] \\.container::before\\s*\\{[^}]*background-image:\\s*var\\(--next-material-sheen\\);[^}]*backdrop-filter:\\s*var\\(--next-backdrop-filter\\)/s,\n    'global wallpaper applies sidebar and corner glass on one continuous container material plane');"""
          if text.count(old) != 1:
              raise SystemExit('expected stale sidebar-glass assertion not found exactly once')
          test_path.write_text(text.replace(old, new), encoding='utf-8')

          def identity(path):
              data = Path(path).read_bytes()
              return {
                  'blob': hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest(),
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          test_id = identity(test_path)
          manifest_path = Path('ci/source-entry/projection_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          hits = 0
          for profile_name, profile in manifest['profiles'].items():
              for entry in profile.get('entries', []):
                  if entry.get('path') == str(test_path):
                      if entry.get('mode') != '100644' or entry.get('type') != 'blob' or entry.get('kind') != 'source':
                          raise SystemExit(f'unexpected appearance-test manifest contract for {profile_name}')
                      entry['blob'] = test_id['blob']
                      entry['size'] = test_id['size']
                      entry['sha256'] = test_id['sha256']
                      hits += 1
          if hits != 1:
              raise SystemExit(f'expected exactly one appearance-test manifest entry, found {hits}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          manifest_id = identity(manifest_path)

          pin_pattern = re.compile(
              r"('ci/source-entry/projection_manifest\.json': \{'size': )\d+(, 'blob': ')[0-9a-f]{40}(', 'sha256': ')[0-9a-f]{64}('\})"
          )
          counts = {}
          for workflow in [Path('.github/workflows/chat_kernel_ui.yml'), Path('.github/workflows/mobile_sync.yml')]:
              workflow_text = workflow.read_text(encoding='utf-8')
              replacement = (
                  rf"\g<1>{manifest_id['size']}\g<2>{manifest_id['blob']}"
                  rf"\g<3>{manifest_id['sha256']}\g<4>"
              )
              workflow_text, count = pin_pattern.subn(replacement, workflow_text)
              expected = 1 if workflow.name == 'chat_kernel_ui.yml' else 3
              if count != expected:
                  raise SystemExit(f'unexpected manifest pin count in {workflow}: {count} != {expected}')
              workflow.write_text(workflow_text, encoding='utf-8')
              counts[str(workflow)] = count

          print(json.dumps({
              'test': test_id,
              'manifest': manifest_id,
              'test_hits': hits,
              'pin_counts': counts,
          }, indent=2))
          PY

          node --check "$TEST"
          node "$TEST"
          npm run test:appearance-studio
          node scripts/test-next-ui-tab-lifecycle.mjs
          node scripts/test-webawesome-adapter.mjs
          node --test tests/lifecycle-scope.test.js tests/next-ui-registries.test.mjs tests/topic-list-mode-lifecycle.test.js
          npm run test:bootstrap
          python3 -m unittest discover -s ci/source-entry/tests -p 'test_*.py'

          mapfile -t changed < <(git diff --name-only | sort)
          expected=("$CHAT" "$MOBILE" "$MANIFEST" "$TEST")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

          git config user.name 'Nuobao CI Reconciler'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'fix(ci): align appearance test with shared material plane'
          candidate="$(git rev-parse HEAD)"
          echo "PR49_FULL_CANDIDATE=$candidate"

          set +e
          git push origin HEAD:"$BRANCH"
          full_push_status=$?
          set -e
          if [ "$full_push_status" -eq 0 ]; then
            echo 'PR49_FULL_CANDIDATE_PUSHED=1'
            exit 0
          fi
          echo 'PR49_FULL_CANDIDATE_PUSHED=0'

          git reset --soft HEAD^
          git reset -- "$CHAT" "$MOBILE"
          git commit -m 'fix(ci): align appearance test with shared material plane'
          git push origin HEAD:"$BRANCH"
          echo "PR49_NONWORKFLOW_HEAD=$(git rev-parse HEAD)"
