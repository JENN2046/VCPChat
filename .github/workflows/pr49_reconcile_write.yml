name: PR49 Reconcile Write

on:
  push:
    paths:
      - '.github/workflows/pr49_reconcile_write.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Merge target and resolve reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PR49 Reconciliation'
          git config user.email 'pr49-reconciliation@users.noreply.github.com'
          git fetch --no-tags origin NuobaoVCPchat

          expected_target='af76c8798b9e1c8f4795ffb72c0bc5c48aed38c9'
          actual_target="$(git rev-parse origin/NuobaoVCPchat)"
          if [ "$actual_target" != "$expected_target" ]; then
            echo "Target moved: expected $expected_target, got $actual_target" >&2
            exit 1
          fi

          set +e
          git merge --no-ff --no-commit origin/NuobaoVCPchat
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 1 ]; then
            echo "Expected reviewed conflict merge status 1, got $merge_status" >&2
            exit 1
          fi

          actual_conflicts="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
          expected_conflicts="$(cat <<'EOF'
          .github/workflows/mobile_sync.yml
          docs/contracts/generated/chat-event-graph.json
          modules/renderer/streamManager.js
          scripts/next-delta-shared-baseline.json
          styles/ui-system/settings.css
          styles/ui-system/tokens.css
          tests/notification-menu-controller.test.js
          tests/resident-ephemeral-presentation.test.js
          EOF
          )"
          if [ "$actual_conflicts" != "$expected_conflicts" ]; then
            echo 'Conflict set changed; refusing automatic resolution.' >&2
            echo 'Actual:' >&2
            printf '%s\n' "$actual_conflicts" >&2
            exit 1
          fi

          # 1) CI trust boundary: PR48's verified-source workflow semantically
          # supersedes the upstream five-line npm-install-only change.
          git checkout --theirs .github/workflows/mobile_sync.yml

          # 2) Upstream owns the current split UI structure and stream runtime.
          # Re-apply the narrow PR48 semantics onto those current files.
          git checkout --ours modules/renderer/streamManager.js
          git checkout --ours styles/ui-system/settings.css
          git checkout --ours styles/ui-system/tokens.css
          git checkout --ours scripts/next-delta-shared-baseline.json
          git checkout --ours docs/contracts/generated/chat-event-graph.json

          # 3) PR48 Resident tests are the stronger accepted contract; the
          # notification test is reconstructed below against the newer menu.
          git checkout --theirs tests/resident-ephemeral-presentation.test.js

          python3 - <<'PY'
          from pathlib import Path

          def replace_preserving_newlines(path_value, old, new):
              path = Path(path_value)
              data = path.read_bytes()
              newline = '\r\n' if data.count(b'\r\n') > 0 else '\n'
              old_b = old.replace('\n', newline).encode('utf-8')
              new_b = new.replace('\n', newline).encode('utf-8')
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f'{path}: expected one reviewed replacement, found {count}')
              path.write_bytes(data.replace(old_b, new_b, 1))

          replace_preserving_newlines(
              'modules/renderer/streamManager.js',
              """import {
              renderResidentEphemeralPresentation as renderResidentPresentationCard
          } from './residentEphemeralPresentation.mjs';""",
              """import {
              validateResidentEphemeralPresentation as validateResidentPresentation,
              renderResidentEphemeralPresentation as renderResidentPresentationCard
          } from './residentEphemeralPresentation.mjs';""",
          )

          replace_preserving_newlines(
              'modules/renderer/streamManager.js',
              """function renderResidentEphemeralPresentation(messageId, presentation, context) {
              if (disposed || !isMessageForCurrentView(context)) return false;
              const result = renderResidentPresentationCard({
                  container: refs.chatMessagesDiv,
                  document: ownerDocument(),
                  messageId,
                  presentation
              });
              if (result === null) return false;
              if (!result.rendered) return true;

              const existing = residentPresentations.get(messageId);
              if (existing) {
                  clearOwnedTimeout(existing.timer);
                  existing.element.remove();
              }
              const timer = scheduleOwnedTimeout(() => {
                  result.element.remove();
                  residentPresentations.delete(messageId);
              }, result.expiresInMilliseconds);
              residentPresentations.set(messageId, { timer, element: result.element });
              refs.uiHelper?.scrollToBottom?.();
              return true;
          }""",
              """function renderResidentEphemeralPresentation(messageId, presentation, context) {
              if (disposed || !isMessageForCurrentView(context)) return false;
              const validated = validateResidentPresentation(presentation);
              if (validated === null) return false;
              const presentationKey = JSON.stringify(validated);
              const existing = residentPresentations.get(messageId);
              // Deduplicate this payload, not every consent challenge for the request.
              if (existing?.presentationKey === presentationKey
                  && existing.element.parentNode === refs.chatMessagesDiv) return true;
              if (existing) {
                  clearOwnedTimeout(existing.timer);
                  existing.element.remove();
                  residentPresentations.delete(messageId);
              }
              const result = renderResidentPresentationCard({
                  container: refs.chatMessagesDiv,
                  document: ownerDocument(),
                  messageId,
                  presentation: validated
              });
              if (result === null) return false;
              if (!result.rendered) return true;

              const timer = scheduleOwnedTimeout(() => {
                  if (residentPresentations.get(messageId)?.element !== result.element) return;
                  result.element.remove();
                  residentPresentations.delete(messageId);
              }, result.expiresInMilliseconds);
              residentPresentations.set(messageId, { timer, element: result.element, presentationKey });
              refs.uiHelper?.scrollToBottom?.();
              return true;
          }""",
          )

          # PR48 tokenization moved with the upstream stylesheet split.
          replace_preserving_newlines(
              'styles/ui-system/settings-stream-animation.css',
              """#replayStreamAnimationPreview > span {
                  display: inline-block;
                  font-size: 1.15em;""",
              """#replayStreamAnimationPreview > span {
                  display: inline-block;
                  font-size: var(--vcp-ui-font-replay-preview);""",
          )
          replace_preserving_newlines(
              'styles/ui-system/tokens.css',
              """        --vcp-ui-font-reasoning-icon: 21px;
                  --vcp-ui-font-disclosure: 24px;
                  --vcp-ui-font-section: 16px;""",
              """        --vcp-ui-font-reasoning-icon: 21px;
                  --vcp-ui-font-disclosure: 24px;
                  --vcp-ui-font-replay-preview: 1.15em;
                  --vcp-ui-font-section: 16px;""",
          )
          PY

          cat > tests/notification-menu-controller.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const { JSDOM } = require('jsdom');
          const { NotificationMenuController } = require('../modules/ui-system/next-shell/notification-menu-controller.js');

          function fixture() {
              const dom = new JSDOM(`<!doctype html><body>
                <button id="nextUiNotificationMenuBtn" aria-expanded="false"></button>
                <div id="nextUiNotificationMenu" role="menu" hidden>
                  <button id="nextUiNotificationForum" role="menuitem"></button>
                  <button id="nextUiNotificationMemo" role="menuitem"></button>
                  <button id="nextUiNotificationLog" role="menuitem"></button>
                  <button id="nextUiNotificationObserver" role="menuitem"></button>
                  <button id="nextUiNotificationFilterToggle" role="menuitemcheckbox" aria-checked="false"><span id="nextUiNotificationFilterState"></span></button>
                  <button id="nextUiNotificationSettings" role="menuitem"></button>
                  <button id="nextUiNotificationClear" role="menuitem"></button>
                </div>
                <button id="settingsFocusTarget"></button>
              </body>`, { pretendToBeVisual: true, url: 'file:///notification.html' });
              return dom;
          }

          test('notification menu owns current commands, keyboard focus and lifecycle cleanup', async () => {
              const dom = fixture();
              const calls = [];
              let enabled = false;
              const byId = id => dom.window.document.getElementById(id);
              const dispatcher = {
                  register(entry) { this.entry = entry; return () => { this.entry = null; }; }
              };
              const controller = new NotificationMenuController({
                  window: dom.window,
                  document: dom.window.document,
                  commands: () => ({
                      openForum: () => calls.push('forum'),
                      openMemo: () => calls.push('memo'),
                      openLog: () => calls.push('log'),
                      openRagObserver: () => calls.push('observer'),
                      toggleNotificationFilter: () => { calls.push('toggle'); enabled = !enabled; },
                      openNotificationFilterSettings: () => {
                          calls.push('filter-settings');
                          byId('settingsFocusTarget').focus();
                      },
                      clearNotifications: () => calls.push('clear'),
                  }),
                  filterManager: { isFilterEnabled: () => enabled },
                  escapeDispatcher: dispatcher,
              });
              assert.equal(controller.mount(), true);
              assert.equal(controller.mount(), true, 'repeat mount must not duplicate listeners');
              const trigger = byId('nextUiNotificationMenuBtn');
              const menu = byId('nextUiNotificationMenu');
              controller.open();
              assert.equal(dom.window.document.activeElement.id, 'nextUiNotificationForum');
              for (const [key, target] of [
                  ['ArrowDown', 'nextUiNotificationMemo'],
                  ['ArrowDown', 'nextUiNotificationLog'],
                  ['End', 'nextUiNotificationClear'],
                  ['Home', 'nextUiNotificationForum'],
                  ['ArrowUp', 'nextUiNotificationClear'],
              ]) {
                  dom.window.document.activeElement.dispatchEvent(new dom.window.KeyboardEvent('keydown', {
                      key, bubbles: true, cancelable: true,
                  }));
                  assert.equal(dom.window.document.activeElement.id, target, key);
              }
              for (const [id, action] of [
                  ['nextUiNotificationForum', 'forum'],
                  ['nextUiNotificationMemo', 'memo'],
                  ['nextUiNotificationLog', 'log'],
                  ['nextUiNotificationObserver', 'observer'],
                  ['nextUiNotificationFilterToggle', 'toggle'],
                  ['nextUiNotificationSettings', 'filter-settings'],
                  ['nextUiNotificationClear', 'clear'],
              ]) {
                  controller.open();
                  byId(id).click();
                  await Promise.resolve();
                  assert.equal(calls.at(-1), action);
                  assert.equal(trigger.getAttribute('aria-expanded'), 'false');
                  assert.equal(menu.hidden, true);
                  assert.equal(dom.window.document.activeElement.id,
                      action === 'filter-settings' ? 'settingsFocusTarget' : 'nextUiNotificationMenuBtn');
              }
              assert.equal(byId('nextUiNotificationFilterToggle').getAttribute('aria-checked'), 'true');

              controller.open();
              const filter = byId('nextUiNotificationFilterToggle');
              filter.focus();
              filter.dispatchEvent(new dom.window.KeyboardEvent('keydown', {
                  key: 'ContextMenu', bubbles: true, cancelable: true,
              }));
              await Promise.resolve();
              assert.equal(calls.at(-1), 'filter-settings');
              assert.equal(menu.hidden, true);
              assert.equal(dom.window.document.activeElement.id, 'settingsFocusTarget');
              assert.deepEqual(calls, [
                  'forum', 'memo', 'log', 'observer', 'toggle',
                  'filter-settings', 'clear', 'filter-settings'
              ]);

              trigger.click();
              assert.equal(dispatcher.entry.close(), true);
              assert.equal(trigger.getAttribute('aria-expanded'), 'false');
              assert.equal(dom.window.document.activeElement, trigger);
              controller.dispose();
              assert.equal(dispatcher.entry, null);
              const callCount = calls.length;
              byId('nextUiNotificationForum').click();
              trigger.click();
              await Promise.resolve();
              assert.equal(calls.length, callCount, 'disposed action listeners must be removed');
              assert.equal(menu.hidden, true, 'disposed trigger must not reopen the menu');
              dom.window.close();
          });

          test('notification menu closes and restores focus after a rejected action', async () => {
              const dom = fixture();
              const toasts = [];
              const controller = new NotificationMenuController({
                  window: dom.window,
                  filterManager: { isFilterEnabled: () => true },
                  showToast: (...args) => toasts.push(args),
              });
              assert.equal(controller.mount(), true);
              controller.open();
              const result = await controller.runAction(async () => { throw new Error('synthetic action rejection'); });
              assert.equal(result.success, false);
              assert.equal(result.error, 'synthetic action rejection');
              assert.equal(toasts.length, 1);
              assert.equal(toasts[0][1], 'error');
              assert.equal(dom.window.document.getElementById('nextUiNotificationMenu').hidden, true);
              assert.equal(dom.window.document.getElementById('nextUiNotificationMenuBtn').getAttribute('aria-expanded'), 'false');
              assert.equal(dom.window.document.activeElement.id, 'nextUiNotificationMenuBtn');
              assert.equal(dom.window.document.getElementById('nextUiNotificationFilterToggle').getAttribute('aria-checked'), 'true');
              controller.dispose();
              dom.window.close();
          });

          test('notification menu refuses incomplete accepted command markup', () => {
              for (const id of [
                  'nextUiNotificationForum', 'nextUiNotificationMemo',
                  'nextUiNotificationLog', 'nextUiNotificationObserver',
                  'nextUiNotificationFilterToggle', 'nextUiNotificationSettings', 'nextUiNotificationClear'
              ]) {
                  const dom = fixture();
                  dom.window.document.getElementById(id).remove();
                  const controller = new NotificationMenuController({ window: dom.window });
                  assert.equal(controller.mount(), false, id);
                  assert.equal(controller.mounted, false);
                  assert.equal(dom.window.document.getElementById('nextUiNotificationMenu').hidden, true);
                  controller.dispose();
                  dom.window.close();
              }
          });
          EOF

          # Preserve explicit DeepMemo 2.0 operational defaults from current target.
          git checkout origin/NuobaoVCPchat -- VCPDistributedServer/Plugin/DeepMemo/config.env

          # Regenerate the derived event graph from the reconciled source tree.
          node scripts/build-chat-event-graph.mjs

          # Refresh the reviewed shared-file digests on the final tree while
          # retaining the newer upstream rationales and recording PR48's narrow additions.
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          baseline_path = Path('scripts/next-delta-shared-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          additions = {
              'modules/messageRenderer.js': 'reconciled with PR48 Resident ephemeral presentation delegation without adding durable history authority',
              'modules/renderer/streamManager.js': 'reconciled with PR48 validation-before-deduplication, distinct-challenge replacement, and stale-expiry ownership protection',
          }
          for file_name, entry in baseline.items():
              data = Path(file_name).read_bytes().replace(b'\r\n', b'\n')
              entry['sha256'] = hashlib.sha256(data).hexdigest()
              addition = additions.get(file_name)
              if addition and addition not in entry['reason']:
                  entry['reason'] = entry['reason'].rstrip(' ;') + '; ' + addition
          baseline_path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          # Remove the two temporary diagnostics. The writer is removed through
          # the authenticated connector after the merge commit succeeds.
          git rm -f .github/workflows/pr49_merge_diagnostic.yml .github/workflows/pr49_merge_diagnostic_v2.yml

          git add \
            .github/workflows/mobile_sync.yml \
            docs/contracts/generated/chat-event-graph.json \
            modules/renderer/streamManager.js \
            scripts/next-delta-shared-baseline.json \
            styles/ui-system/settings.css \
            styles/ui-system/settings-stream-animation.css \
            styles/ui-system/tokens.css \
            tests/notification-menu-controller.test.js \
            tests/resident-ephemeral-presentation.test.js \
            VCPDistributedServer/Plugin/DeepMemo/config.env

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'Unmerged paths remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          grep -Fq 'Verify and materialize required source' .github/workflows/mobile_sync.yml
          grep -Fq 'ci/source-entry/**' .github/workflows/mobile_sync.yml
          grep -Fq 'validateResidentEphemeralPresentation as validateResidentPresentation' modules/renderer/streamManager.js
          grep -Fq 'presentationKey' modules/renderer/streamManager.js
          grep -Fq 'residentPresentations.get(messageId)?.element !== result.element' modules/renderer/streamManager.js
          grep -Fq 'font-size: var(--vcp-ui-font-replay-preview);' styles/ui-system/settings-stream-animation.css
          grep -Fq -- '--vcp-ui-font-replay-preview: 1.15em;' styles/ui-system/tokens.css
          grep -Fq 'DeepMemoBackend=central' VCPDistributedServer/Plugin/DeepMemo/config.env
          grep -Fq 'same-request consent deduplicates the validated payload and replaces different content' tests/resident-ephemeral-presentation.test.js
          grep -Fq 'nextUiNotificationForum' tests/notification-menu-controller.test.js
          grep -Fq "key: 'ContextMenu'" tests/notification-menu-controller.test.js
          node --check modules/lyrics/lyricFetcherUnified.js
          node --check modules/renderer/streamManager.js
          node --check modules/ui-system/next-shell/notification-menu-controller.js
          node --check tests/notification-menu-controller.test.js

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          baseline = json.loads(Path('scripts/next-delta-shared-baseline.json').read_text(encoding='utf-8'))
          for file_name, entry in baseline.items():
              digest = hashlib.sha256(Path(file_name).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
              if digest != entry['sha256']:
                  raise SystemExit(f'baseline digest mismatch: {file_name}')
          PY

          echo '--- FINAL MERGE STATUS ---'
          git status --short
          git commit -m 'Merge NuobaoVCPchat and preserve PR48 hardening'
          git push origin HEAD:codex/update-vcpchat-20260912
