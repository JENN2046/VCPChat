name: PR49 Reconcile Retry

on:
  push:
    paths:
      - '.github/workflows/pr49_reconcile_retry.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Run reviewed reconciliation with mirrored token scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr49_reconcile_write.yml').read_text(encoding='utf-8')
          marker = '      - name: Merge target and resolve reviewed conflicts\n'
          start = workflow.index(marker) + len(marker)
          run_marker = '        run: |\n'
          run_start = workflow.index(run_marker, start) + len(run_marker)
          lines = workflow[run_start:].splitlines()
          body = []
          for line in lines:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          script = '\n'.join(body) + '\n'

          old = """def replace_preserving_newlines(path_value, old, new):
              path = Path(path_value)
              data = path.read_bytes()
              newline = '\\r\\n' if data.count(b'\\r\\n') > 0 else '\\n'
              old_b = old.replace('\\n', newline).encode('utf-8')
              new_b = new.replace('\\n', newline).encode('utf-8')
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f'{path}: expected one reviewed replacement, found {count}')
              path.write_bytes(data.replace(old_b, new_b, 1))"""
          new = """def replace_preserving_newlines(path_value, old, new):
              path = Path(path_value)
              data = path.read_bytes()
              newline = '\\r\\n' if data.count(b'\\r\\n') > 0 else '\\n'
              old_b = old.replace('\\n', newline).encode('utf-8')
              new_b = new.replace('\\n', newline).encode('utf-8')
              expected = 2 if path_value == 'styles/ui-system/tokens.css' else 1
              count = data.count(old_b)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} reviewed replacement(s), found {count}')
              path.write_bytes(data.replace(old_b, new_b, expected))"""
          if script.count(old) != 1:
              raise SystemExit('reviewed helper block changed; refusing retry')
          script = script.replace(old, new, 1)
          Path('/tmp/pr49-reconcile.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/pr49-reconcile.sh
