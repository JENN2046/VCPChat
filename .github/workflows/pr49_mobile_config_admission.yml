name: PR49 Prepare Workflow Pin Blobs

on:
  push:
    paths:
      - '.github/workflows/pr49_mobile_config_admission.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: codex/update-vcpchat-20260912
          fetch-depth: 0

      - name: Generate exact pinned workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd5ed724767321f3b8670624961b31102b8531ee2'
          test "$(git hash-object ci/source-entry/projection_manifest.json)" = '8ccd9afd75c0d26d38725143f65455f43a053ba9'
          python3 - <<'PY'
          from pathlib import Path

          old = "'ci/source-entry/projection_manifest.json': {'size': 644919, 'blob': 'c95b76d9cd84ca380eaa80c665d2661ebf4f7e70', 'sha256': 'a309b94bafdf4bcda87d5a47430fcf125ff2a55d8e5758033546efb983f89b77'}"
          new = "'ci/source-entry/projection_manifest.json': {'size': 645253, 'blob': '8ccd9afd75c0d26d38725143f65455f43a053ba9', 'sha256': '247862c8d37c0686215d8a3eeaabd7277bf35dc95ef7e276cbf4c47e6dcef2be'}"
          jobs = [
              (Path('.github/workflows/chat_kernel_ui.yml'), Path('ci/source-entry/pr49-chat-kernel-ui.next.yml'), 1),
              (Path('.github/workflows/mobile_sync.yml'), Path('ci/source-entry/pr49-mobile-sync.next.yml'), 3),
          ]
          for source, target, expected in jobs:
              text = source.read_text(encoding='utf-8')
              if text.count(old) != expected or new in text:
                  raise SystemExit(f'unexpected pin state in {source}')
              next_text = text.replace(old, new)
              if next_text.count(new) != expected or next_text.replace(new, old) != text:
                  raise SystemExit(f'non-pin drift while generating {target}')
              target.write_text(next_text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/source-entry/pr49-chat-kernel-ui.next.yml ci/source-entry/pr49-mobile-sync.next.yml
          git commit -m 'Prepare exact CI workflow pin blobs'
          git push origin HEAD:codex/update-vcpchat-20260912
