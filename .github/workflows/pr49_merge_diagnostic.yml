name: PR49 Merge Diagnostic

on:
  push:
    paths:
      - '.github/workflows/pr49_merge_diagnostic.yml'

permissions:
  contents: read

jobs:
  merge-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Diagnose merge with NuobaoVCPchat
        shell: bash
        run: |
          set -u
          git config user.name 'PR49 Merge Diagnostic'
          git config user.email 'pr49-merge-diagnostic@users.noreply.github.com'
          git fetch --no-tags origin NuobaoVCPchat
          set +e
          git merge --no-commit --no-ff origin/NuobaoVCPchat
          merge_status=$?
          set -e
          echo "MERGE_STATUS=${merge_status}"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TARGET=$(git rev-parse origin/NuobaoVCPchat)"
          echo '--- UNMERGED PATHS ---'
          git diff --name-only --diff-filter=U || true
          echo '--- INDEX STATUS ---'
          git status --short
          echo '--- CONFLICT HUNKS ---'
          git diff --cc -- || true
          git merge --abort >/dev/null 2>&1 || true
          exit 0
